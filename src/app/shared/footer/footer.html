<footer class="site-footer">
  <div class="container">
    <div class="site-footer__grid">
      <div class="site-footer__col">
        <a class="logo site-footer__logo" routerLink="/">
          <img
            class="logo__img"
            src="img/logo.webp"
            width="380"
            height="168"
            alt="web33 — Александр, веб-разработка"
          />
        </a>
        <p class="site-footer__about">{{ about() }}</p>
      </div>
      <div class="site-footer__col">
        <h4 class="site-footer__title">Разделы</h4>
        <ul class="site-footer__list">
          @for (link of links; track link.label) {
            <li class="site-footer__item">
              <a class="site-footer__link" [routerLink]="link.route" [fragment]="link.fragment">{{
                link.label
              }}</a>
            </li>
          }
        </ul>
      </div>
      <div class="site-footer__col">
        <h4 class="site-footer__title">Контакты</h4>
        <ul class="site-footer__list">
          <li class="site-footer__item">
            <a class="site-footer__link" [href]="'mailto:' + contacts.email">{{
              contacts.email
            }}</a>
          </li>
          <li class="site-footer__item">
            <a
              class="site-footer__link"
              [href]="contacts.telegramUrl"
              target="_blank"
              rel="noopener"
              >Telegram: {{ contacts.telegramHandle }}</a
            >
          </li>
          <li class="site-footer__item">
            <a class="site-footer__link" routerLink="/" fragment="contact">Оставить заявку</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="site-footer__bottom">
      <span>© {{ year }} web33 · Александр</span>
      <span
        ><a class="site-footer__bottom-link" routerLink="/privacy"
          >Политика конфиденциальности</a
        ></span
      >
    </div>
  </div>
</footer>
