<blockquote class="quote">
  <div class="stars" aria-label="5 из 5">★★★★★</div>
  <p class="quote__text">{{ quote().text }}</p>
  <div class="quote__author">
    <app-avatar [name]="quote().name" />
    <span>
      <b class="quote__name">{{ quote().name }}</b>
      <span class="quote__role">{{ quote().role }}</span>
    </span>
  </div>
</blockquote>
