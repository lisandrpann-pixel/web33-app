<app-hero [hero]="hero"></app-hero>

<section class="section section--soft">
  <div class="container">
    <app-section-head
      [centered]="true"
      eyebrow="Для кого"
      title="Возраст и уровень не важны — главное желание"
      lead="От «что такое HTML» до «нужно подтянуть React» — подстроимся под стартовую точку."
    ></app-section-head>
    <div class="grid grid--3">
      @for (card of forWhom; track card.title) {
        <app-info-card [card]="card"></app-info-card>
      }
    </div>
    <app-blockquote class="note-quote">{{ note }}</app-blockquote>
  </div>
</section>

<section class="section" id="programs">
  <div class="container">
    <app-section-head
      eyebrow="Программы и цены"
      title="Куда пойдём кодить"
      lead="Выберите направление — либо скажите цель, и я разложу её на понятные шаги."
    ></app-section-head>
    <div class="grid grid--3">
      @for (pkg of programs; track pkg.title) {
        <app-service-card [pkg]="pkg" [cta]="programCta"></app-service-card>
      }
    </div>
  </div>
</section>

<section class="section section--soft">
  <div class="container">
    <app-section-head
      [centered]="true"
      eyebrow="Как проходят занятия"
      title="Четыре принципа — без них никак"
    ></app-section-head>
    <div class="grid grid--2">
      @for (feature of principles; track feature.title) {
        <app-feature [feature]="feature"></app-feature>
      }
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <app-section-head
      [centered]="true"
      eyebrow="Вопросы"
      title="Вопросы, которые задают до оплаты (и правильно делают)"
    ></app-section-head>
    <app-faq [items]="faq"></app-faq>
  </div>
</section>

<app-contact-cta [data]="contact" [reply]="shortReply" [soft]="true"></app-contact-cta>
