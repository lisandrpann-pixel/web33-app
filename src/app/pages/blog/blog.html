<app-page-head
  [breadcrumbs]="breadcrumbs"
  [eyebrow]="page.eyebrow"
  [title]="page.title"
  [lead]="page.lead"
></app-page-head>

<section class="section section--tight">
  <div class="container">
    <div class="grid grid--3">
      @for (post of posts; track post.slug) {
        <app-case-card [data]="toCard(post)"></app-case-card>
      }
    </div>

    <p class="section-foot muted">
      {{ footnote }}
      <a class="link-arrow" [href]="contacts.telegramUrl" target="_blank" rel="noopener">Telegram</a
      >.
    </p>
  </div>
</section>
