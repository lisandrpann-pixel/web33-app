<section class="section" [class.section--soft]="soft()" id="contact">
  <div class="container">
    <div class="cta">
      <div class="cta__grid">
        <div>
          <span class="cta__eyebrow">{{ data().eyebrow }}</span>
          <h2 class="cta__title">{{ data().title }}</h2>
          <p class="lead lead--inverse">{{ data().lead }}</p>
          <ul class="cta__contacts">
            <li class="cta__contact">
              <app-icon name="mail" [size]="20"></app-icon>
              <a class="cta__link" [href]="'mailto:' + contacts.email">{{ contacts.email }}</a>
            </li>
            <li class="cta__contact">
              <app-icon name="telegram" [size]="20"></app-icon>
              <a class="cta__link" [href]="contacts.telegramUrl" target="_blank" rel="noopener"
                >Telegram: {{ contacts.telegramHandle }}</a
              >
            </li>
            <li class="cta__contact">
              <app-icon name="clock" [size]="20"></app-icon>
              {{ reply() ?? defaultReply }}
            </li>
          </ul>
        </div>

        <app-contact-form [config]="data().form"></app-contact-form>
      </div>
    </div>
  </div>
</section>
