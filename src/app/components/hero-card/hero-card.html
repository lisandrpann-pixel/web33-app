@let cardValue = card();

<aside class="hero-card" [attr.aria-label]="cardValue.title ?? 'С чего начать'">
  @if (cardValue.person; as person) {
    <div class="hero-card__person">
      <app-avatar [name]="person.name" imgSrc="img/avatars/about.jpeg" size="lg" />
      <div>
        <b class="hero-card__person-name">{{ person.name }}</b>
        <div class="hero-card__person-role">{{ person.role }}</div>
      </div>
    </div>
  } @else {
    <h3 class="hero-card__title">{{ cardValue.title }}</h3>
    <p class="hero-card__note">{{ cardValue.note }}</p>
  }

  @for (row of cardValue.rows; track row.label) {
    <div class="hero-card__row">
      <span class="hero-card__label">{{ row.label }}</span>
      <span class="hero-card__value" [class.hero-card__value--badge]="row.badge">{{
        row.value
      }}</span>
    </div>
  }

  <a
    class="btn btn--primary btn--block hero-card__btn"
    [routerLink]="cardValue.button.route"
    [fragment]="cardValue.button.fragment"
    >{{ cardValue.button.label }}</a
  >
  <p class="hero-card__hint">{{ cardValue.hint }}</p>
</aside>
