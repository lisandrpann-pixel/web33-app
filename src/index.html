<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Разработка сайтов, магазинов и веб-приложений под ключ — web33</title>
    <meta
      name="description"
      content="Разработаю сайт, интернет-магазин или веб-приложение под ключ: от брифа до запуска. Лендинги от 3 дней и от 5 000 ₽, поддержка от 1 000 ₽. 10+ лет в веб-разработке. Отвечаю в течение 2 часов."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#0a0f1c" />
    <script>
      /* Тема по умолчанию — тёмная; применяем до отрисовки, чтобы не было «вспышки» неверной темы. */
      (function () {
        try {
          var theme = localStorage.getItem('web33-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <app-root></app-root>
  </body>
</html>
